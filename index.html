  <script>
    /* Offline-Betrieb nur, wenn die Seite von einem Server kommt.
       Als lokale Datei (file://) gibt es keinen Service-Worker — dafür ist
       standalone.html da. */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
