# Veröffentlicht die Vorlagen-Zentrale auf GitHub Pages.
#
# Der Ablauf schaltet Pages beim ersten Lauf selbst ein (enablement: true).
# Er läuft bei jedem Push auf main; die Seite steht danach unter
#   https://elpollo619.github.io/N-s-Hotel-template-system/
#
# Veröffentlicht wird der Projektordner unverändert — es ist eine statische
# Seite ohne Bauschritt. Die lizenzpflichtigen Schriften liegen nicht im
# Repository und werden folglich auch nicht mitveröffentlicht.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Lauf nach dem anderen; ein laufender wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true schaltet Pages beim ersten Lauf selbst ein — dafür
      # genügt die oben erteilte Berechtigung "pages: write". Ohne diesen
      # Schalter bricht der Lauf mit "Get Pages site failed" ab, solange
      # niemand den Schalter unter Settings → Pages von Hand umgelegt hat.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
